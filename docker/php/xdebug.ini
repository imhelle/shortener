; Xdebug выключен по умолчанию (mode=off) — он заметно тормозит PHP.
; Включается через переменную XDEBUG_MODE в .env: debug -> перезапустить `make up`.
; В PhpStorm: Settings > PHP > Servers, name = shortener, host = localhost,
; port = ${NGINX_PORT}, "Use path mappings": ./app -> /var/www/app

xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = yes
xdebug.idekey = PHPSTORM
xdebug.log_level = 0
xdebug.discover_client_host = false
