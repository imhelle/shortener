; Xdebug is off by default (mode=off) — it slows PHP down noticeably.
; Switched on through XDEBUG_MODE in .env: debug -> restart with `make up`.
; In PhpStorm: Settings > PHP > Servers, name = shortener, host = localhost,
; port = ${NGINX_PORT}, "Use path mappings": ./app -> /var/www/app

xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = yes
xdebug.idekey = PHPSTORM
xdebug.log_level = 0
xdebug.discover_client_host = false
